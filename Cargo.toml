[package]
name = "velvet"
version = "0.1.0"
edition = "2021"
description = "Velvet — Fast, lightweight Windows 11 app launcher built with GPUI"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
async-channel = "2"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
nucleo-matcher = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
toml = "0.8"
walkdir = "2"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Networking_WinHttp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
]

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = false
codegen-units = 16
incremental = true
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
incremental = false
strip = true
